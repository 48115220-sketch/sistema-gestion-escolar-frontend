<app-navbar></app-navbar>

<div class="container">

  <app-login *ngIf="!apiService.obtenerToken()" (loginExitoso)="onLoginExitoso()"></app-login>

  <div *ngIf="apiService.obtenerToken()">
    
    <div class="alert alert-success d-flex justify-content-between align-items-center py-2 mb-4">
      <span><strong>Autenticación exitosa:</strong> Conectado a la red de microservicios.</span>
      <div>
        <span class="badge bg-primary me-2">ROL: {{ apiService.obtenerRol() || 'USUARIO' }}</span>
        <span class="badge bg-success">JWT ACTIVO</span>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-lg-4 mb-4" *ngIf="apiService.tieneRol(['PRECEPTOR', 'ADMINISTRATIVO', 'DIRECTOR', 'ROOT'])">
        <app-alumnos></app-alumnos>
      </div>

      <div class="col-12 col-lg-4 mb-4" *ngIf="apiService.tieneRol(['ROOT', 'PRECEPTOR', 'DOCENTE', 'DIRECTOR'])">
        <app-cursos></app-cursos>
      </div>

      <div class="col-12 col-lg-4 mb-4" *ngIf="apiService.tieneRol(['ROOT', 'ADMINISTRATIVO', 'DIRECTOR'])">
        <app-personal></app-personal>
      </div>
    </div>

  </div>

</div>
