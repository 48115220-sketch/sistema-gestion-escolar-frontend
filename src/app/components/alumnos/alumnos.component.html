<div class="card p-3 mb-4 shadow-sm">
  <h4 class="text-danger">{{ modoEdicion ? 'Editar Alumno' : 'Registrar Alumno' }}</h4>
  <div class="row g-2">
    <div class="col-12 col-sm-6 col-md-3">
      <input type="text" [(ngModel)]="nombre" placeholder="Nombre" class="form-control">
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <input type="text" [(ngModel)]="apellido" placeholder="Apellido" class="form-control">
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <input type="text" [(ngModel)]="dni" placeholder="Documento" class="form-control">
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <select [(ngModel)]="cursoId" class="form-select">
        <option [ngValue]="null" disabled selected>Seleccione Curso</option>
        <option *ngFor="let c of cursos" [value]="c.id">{{ c.nombre }}</option>
      </select>
    </div>
  </div>
  <div class="mt-3 d-flex flex-wrap gap-2">
    <button (click)="guardarAlumno()" class="btn btn-danger">{{ modoEdicion ? 'Guardar Cambios' : 'Registrar Alumno' }}</button>
    <button *ngIf="modoEdicion" (click)="limpiarFormulario()" class="btn btn-secondary">Cancelar</button>
  </div>
</div>

<div class="card p-3 mb-4 shadow-sm">
  <h4>Alumnos Registrados</h4>
  <div class="table-responsive" *ngIf="alumnos.length > 0">
    <table class="table table-striped align-middle mt-2 mb-0">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Documento</th>
          <th>Curso ID</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of alumnos">
          <td>{{ a.id }}</td>
          <td>{{ a.nombre }}</td>
          <td>{{ a.apellido }}</td>
          <td>{{ a.dni }}</td>
          <td>{{ a.cursoId }}</td>
          <td class="text-center">
            <div class="d-flex justify-content-center gap-1">
              <button (click)="seleccionarParaEditar(a)" class="btn btn-warning btn-sm">Editar</button>
              <button (click)="eliminarAlumno(a.id)" class="btn btn-danger btn-sm">Eliminar</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="alumnos.length === 0" class="alert alert-info text-center mt-2 mb-0">No hay alumnos registrados.</div>
</div>
