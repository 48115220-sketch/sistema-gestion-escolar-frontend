<div class="card p-3 mb-4 shadow-sm">
  <h4 class="text-danger">{{ modoEdicion ? 'Editar Curso' : 'Registrar Curso' }}</h4>
  <div class="row g-2">
    <div class="col-12 col-md-6">
      <input type="text" [(ngModel)]="nombre" placeholder="Nombre del Curso" class="form-control">
    </div>
    <div class="col-12 col-md-6">
      <input type="number" [(ngModel)]="docenteId" placeholder="ID del Docente" class="form-control">
    </div>
  </div>
  <div class="mt-3 d-flex flex-wrap gap-2">
    <button (click)="guardarCurso()" class="btn btn-danger">{{ modoEdicion ? 'Guardar Cambios' : 'Registrar Curso' }}</button>
    <button *ngIf="modoEdicion" (click)="limpiarFormulario()" class="btn btn-secondary">Cancelar</button>
  </div>
</div>

<div class="card p-3 shadow-sm">
  <h4>Cursos Habilitados</h4>
  <div class="table-responsive" *ngIf="cursos.length > 0">
    <table class="table table-striped align-middle mt-2 mb-0">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Docente ID</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cursos">
          <td>{{ c.id }}</td>
          <td>{{ c.nombre }}</td>
          <td>{{ c.docenteId }}</td>
          <td class="text-center">
            <div class="d-flex justify-content-center gap-1">
              <button (click)="seleccionarParaEditar(c)" class="btn btn-warning btn-sm">Editar</button>
              <button (click)="eliminarCurso(c.id)" class="btn btn-danger btn-sm">Eliminar</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="cursos.length === 0" class="alert alert-info text-center mt-2 mb-0">No hay cursos disponibles.</div>
</div>
